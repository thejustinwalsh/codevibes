#cloud-config
package_update: true
packages: [openssh-server, podman, uidmap, slirp4netns, git, curl, jq, sqlite3, ufw, fail2ban]
users:
  - default          # keep the distro/Hetzner default user so the injected SSH key lands
  - name: codevibes
    shell: /bin/bash
    lock_passwd: true
write_files:
  - path: /etc/systemd/journald.conf.d/00-codevibes.conf
    content: |
      [Journal]
      SystemMaxUse=500M
      MaxRetentionSec=2week
  - path: /etc/codevibes/cf-service-token.env
    permissions: '0600'
    owner: root:root
    content: |
      CF_SERVICE_TOKEN_ID=__CF_SERVICE_TOKEN_ID__
      CF_SERVICE_TOKEN_SECRET=__CF_SERVICE_TOKEN_SECRET__
  # SSH posture: port open to the world, KEY-ONLY (passwords off), root via key only,
  # brute-force throttled by fail2ban. No source-IP allow-list (fragile behind
  # iCloud Private Relay / changing egress IPs).
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      mode = aggressive
      maxretry = 4
      findtime = 10m
      bantime = 1h
  # Key-only SSH via a drop-in. Ubuntu 24.04+/26.04 keep these in sshd_config.d/*.conf,
  # NOT the main sshd_config, so editing the main file does nothing. A 00- drop-in is
  # read first (first-match wins) so it overrides the cloud image's defaults.
  # prohibit-password (not "no") keeps key-based root working — there's no other
  # key-bearing SSH account, so "no" would lock the box out.
  - path: /etc/ssh/sshd_config.d/00-codevibes.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      PubkeyAuthentication yes
runcmd:
  - systemctl restart systemd-journald
  # NOTE: --force is ONLY valid for `enable`/`reset`. Using it on `default`/`allow`
  # makes ufw print usage and add NO rule — which previously left ufw enabled with
  # default-deny and no SSH allow, silently dropping port 22 (connection timeout).
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw --force enable
  # Apply the sshd drop-in (written above) and start fail2ban.
  - systemctl reload ssh || systemctl reload sshd || true
  - systemctl enable --now fail2ban
  - loginctl enable-linger codevibes
  # mount the detachable data volume idempotently (never reformat existing data)
  - mkdir -p /mnt/codevibes-data
  - DEV=$(ls /dev/disk/by-id/scsi-0HC_Volume_* 2>/dev/null | head -n1)
  - if [ -n "$DEV" ] && ! blkid "$DEV"; then mkfs.ext4 -F "$DEV"; fi
  - if [ -n "$DEV" ]; then grep -q "$DEV" /etc/fstab || echo "$DEV /mnt/codevibes-data ext4 discard,nofail,defaults 0 0" >> /etc/fstab; mount -a; fi
  - chown -R codevibes:codevibes /mnt/codevibes-data /etc/codevibes
  # Mirror the platform-injected SSH key (root, via the `- default` user) to codevibes
  # so you can SSH directly as the deploy user. No-op if root has no key yet.
  - if [ -s /root/.ssh/authorized_keys ]; then install -d -m 700 -o codevibes -g codevibes /home/codevibes/.ssh && install -m 600 -o codevibes -g codevibes /root/.ssh/authorized_keys /home/codevibes/.ssh/authorized_keys; fi
  # clone fork, install units, fetch secrets, first deploy (as codevibes, with user systemd)
  - su - codevibes -c 'git clone -b production https://github.com/__FORK_REPO__.git ~/codevibes'
  # Safety net: ensure scripts are executable even if a commit lost the +x bit.
  - su - codevibes -c 'chmod +x ~/codevibes/deploy/*.sh ~/codevibes/patches/*.sh ~/codevibes/docs/runbooks/*.sh 2>/dev/null || true'
  - su - codevibes -c 'mkdir -p ~/.config/containers/systemd ~/.config/systemd/user'
  - su - codevibes -c 'cp ~/codevibes/deploy/quadlet/*.pod ~/codevibes/deploy/quadlet/*.container ~/codevibes/deploy/quadlet/*.volume ~/.config/containers/systemd/'
  - su - codevibes -c 'cp ~/codevibes/deploy/quadlet/*.timer ~/codevibes/deploy/quadlet/*.service ~/.config/systemd/user/'
  - su - codevibes -c 'cd ~/codevibes/deploy && ./render-config.sh'
  - su - codevibes -c 'export XDG_RUNTIME_DIR=/run/user/$(id -u); set -a; . /etc/codevibes/cf-service-token.env; ~/codevibes/deploy/fetch-secrets.sh'
  - su - codevibes -c 'export XDG_RUNTIME_DIR=/run/user/$(id -u); ~/codevibes/deploy/deploy.sh || true'
  - su - codevibes -c 'export XDG_RUNTIME_DIR=/run/user/$(id -u); systemctl --user daemon-reload; systemctl --user enable --now codevibes-deploy.timer codevibes-backup.timer codevibes-prune.timer'
