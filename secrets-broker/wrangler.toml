name = "codevibes-secrets-broker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Production: bind each secret from Cloudflare Secrets Store (store_id + secret_name
# filled during setup — see cloudflare-secrets runbook). Requires wrangler >=4 with
# Secrets Store GA support; the blocks below are the correct shape.
#
# store_id is your account's SINGLE default Workers Secrets Store (one store / 100
# secrets per account — you cannot create more, and 5 secrets is well within budget).
# Get it from the dashboard or `wrangler secrets-store store list`. All five bindings
# share that same store_id.
#
# [[secrets_store_secrets]]
# binding = "JWT_SECRET"
# store_id = "REPLACE_STORE_ID"
# secret_name = "codevibes-jwt-secret"
#
# [[secrets_store_secrets]]
# binding = "ENCRYPTION_KEY"
# store_id = "REPLACE_STORE_ID"
# secret_name = "codevibes-encryption-key"
#
# [[secrets_store_secrets]]
# binding = "GITHUB_CLIENT_ID"
# store_id = "REPLACE_STORE_ID"
# secret_name = "codevibes-github-client-id"
#
# [[secrets_store_secrets]]
# binding = "GITHUB_CLIENT_SECRET"
# store_id = "REPLACE_STORE_ID"
# secret_name = "codevibes-github-client-secret"
#
# [[secrets_store_secrets]]
# binding = "TUNNEL_CRED"
# store_id = "REPLACE_STORE_ID"
# secret_name = "codevibes-tunnel-cred"

[vars]
# Test-only stub values. In production these bindings come from Secrets Store (above).
# vitest-pool-workers reads wrangler.toml and exposes [vars] as plain strings in `env`.
JWT_SECRET = "test-jwt-secret"
ENCRYPTION_KEY = "test-encryption-key-32chars123456"
GITHUB_CLIENT_ID = "test-github-client-id"
GITHUB_CLIENT_SECRET = "test-github-client-secret"
TUNNEL_CRED = "{\"TunnelID\":\"test-tunnel\"}"
