name: sync-upstream
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "codevibes-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Find newest upstream release tag
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo danish296/codevibes --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Merge upstream tag into production if new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          if git tag --list | grep -qx "$TAG"; then echo "already have $TAG"; exit 0; fi
          git remote add upstream https://github.com/danish296/codevibes.git
          git fetch upstream --tags
          # Merge will fail the job (and email) on conflict — by design.
          git merge --no-edit "$TAG"
          # Strip upstream-leaked SQLite WAL/SHM (contain upstream author data) if the
          # merge reintroduced them; keep production clean. No-op if absent.
          if git ls-files --error-unmatch codevibes-backend/data/codevibes.db-wal >/dev/null 2>&1 \
             || git ls-files --error-unmatch codevibes-backend/data/codevibes.db-shm >/dev/null 2>&1; then
            git rm -q --ignore-unmatch codevibes-backend/data/codevibes.db-wal codevibes-backend/data/codevibes.db-shm
            git commit -q -m "chore: strip upstream-leaked SQLite WAL/SHM after sync"
          fi
          git push origin production
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "Synced from upstream $TAG"
