name: build-images
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "image version label, e.g. v1.0.2", required: true }
      ref: { description: "git ref to build from (branch/tag/sha)", required: false, default: "production" }
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Image version label.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Source to build from: release tag for release events; otherwise the ref
      # input (defaults to `production`, which holds our deploy infra + merged app).
      BUILD_REF: ${{ github.event.release.tag_name || inputs.ref || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Apply production codemod (asserts targets)
        run: sh patches/apply.sh .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./codevibes-backend
          file: ./codevibes-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codevibes-backend:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/codevibes-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          build-args: VITE_API_URL=https://codevibes.tjw.dev
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codevibes-web:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/codevibes-web:latest
